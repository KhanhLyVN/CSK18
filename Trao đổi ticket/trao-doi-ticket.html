<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trao đổi trên Ticket</title>
<link rel="stylesheet" href="traodoiticket.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">

  <div class="topbar">
    <button class="back-btn" id="backBtn">&#8592;</button>
    <div class="mark">HV</div>
    <div class="titles">
      <h1>Trao đổi trên Ticket</h1>
      <span>Học viên &amp; Customer Success</span>
    </div>
  </div>

  <div class="body" id="bodyEl">
    <!-- SIDEBAR: mục lục các ticket -->
    <div class="sidebar">
      <div class="sidebar-head">
        <input class="search" id="searchInput" placeholder="Tìm theo mã phiếu, tiêu đề...">
        <div class="filter-row" id="filterRow">
          <div class="filter-chip active" data-filter="all">Tất cả</div>
          <div class="filter-chip" data-filter="open">Đang mở</div>
          <div class="filter-chip" data-filter="closed">Đã đóng</div>
        </div>
      </div>
      <div class="ticket-list" id="ticketList"></div>
    </div>

    <!-- MAIN: thông tin phiếu + khung chat -->
    <div class="main" id="mainEl"></div>
  </div>
</div>
<script type="module" src="traodoiticket.js"></script>
</body>
</html>
