<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>CS Center - Quản Lý FAQ</title>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

    <style>
        :root {
  --maroon: #5D0703;
  --maroon-deep: #3E0402;
  --maroon-soft: #7A1410;
  --cream: #EEDCC8;
  --cream-pale: #FBF4E9;
  --paper: #FFFBF5;
  --gold: #B08A4E;
  --ink: #2A1712;
  --ink-soft: #6B5348;
  --line: rgba(93,7,3,0.15);
  --ok: #4C6B3C;
  --danger: #A23B2E;
  --edit: #B08A4E;
  --muted: #8A7A6D;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; width: 100%; }
body {
  font-family: 'Inter', sans-serif;
  color: var(--ink);
  background: var(--cream-pale);
  overflow: hidden;
}

.app { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* ---------- Top bar ---------- */
.topbar {
  background: var(--maroon);
  color: var(--cream-pale);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex: none;
  border-bottom: 1px solid rgba(0,0,0,0.15);
  z-index: 100;
}
.menu-toggle {
  background: none; border: none; color: var(--cream-pale);
  font-size: 20px; cursor: pointer; padding: 4px;
  display: flex; align-items: center; justify-content: center;
}
.topbar .mark {
  width: 32px; height: 32px; border-radius: 6px;
  background: var(--cream);
  color: var(--maroon-deep);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Fraunces', serif; font-weight: 700; font-size: 16px;
  flex: none;
}
.topbar .titles { line-height: 1.2; }
.topbar h1 { margin: 0; font-family: 'Fraunces', serif; font-weight: 600; font-size: 17px; }
.topbar span { font-size: 11px; opacity: 0.8; }

/* ---------- Body layout ---------- */
.body { flex: 1; display: flex; min-height: 0; position: relative; overflow: hidden; }

/* ---------- Sidebar ---------- */
.sidebar {
  width: 260px;
  flex: none;
  background: var(--paper);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 90;
  overflow-x: hidden;
}
.sidebar.collapsed { width: 70px; }
.sidebar.collapsed .menu-item span { display: none; }
.sidebar.collapsed .menu-item { justify-content: center; padding: 12px; }

.sidebar-menu { padding: 16px 12px; display: flex; flex-direction: column; gap: 6px; }
.menu-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px;
  border-radius: 8px;
  color: var(--ink-soft);
  text-decoration: none;
  font-size: 13.5px;
  font-weight: 600;
  transition: all 0.2s ease;
  white-space: nowrap;
}
.menu-item svg { width: 18px; height: 18px; flex: none; stroke: currentColor; }
.menu-item:hover { background: var(--cream-pale); color: var(--maroon); }
.menu-item.active { background: var(--cream); color: var(--maroon-deep); font-weight: 700; border-left: 3px solid var(--maroon); }

/* ---------- Main Content Area ---------- */
.main {
  flex: 1;
  overflow-y: auto;
  padding: 24px 32px;
  display: flex;
  flex-direction: column;
  background-image: radial-gradient(circle at 1px 1px, rgba(93,7,3,0.03) 1px, transparent 0);
  background-size: 24px 24px;
}

/* ---------- FAQ Content Styles ---------- */
.container {
  max-width: 900px;
  margin: 0 auto;
  width: 100%;
  background: var(--paper);
  padding: 32px;
  border-radius: 12px;
  border: 1px solid var(--line);
  box-shadow: 0 4px 20px rgba(93,7,3,0.05);
}

h2 {
  font-family: 'Fraunces', serif;
  color: var(--maroon-deep);
  text-align: center;
  margin-bottom: 24px;
  font-size: 28px;
}

.form-group { margin-bottom: 20px; }
label {
  display: block;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--maroon-deep);
  font-size: 14px;
}

input, select, textarea {
  width: 100%;
  padding: 12px;
  border: 1.5px solid var(--line);
  border-radius: 8px;
  background: #fff;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  transition: all 0.2s ease;
  outline: none;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--maroon);
  box-shadow: 0 0 0 3px rgba(93,7,3,0.1);
}

.btn-row { display: flex; gap: 12px; margin-top: 10px; }
button.btn-add {
  background: var(--maroon);
  color: var(--cream-pale);
  padding: 12px 24px;
  border: none;
  border-radius: 8px;
  font-weight: 700;
  cursor: pointer;
  flex: 1;
  transition: all 0.2s ease;
}
button.btn-add:hover { background: var(--maroon-deep); transform: translateY(-1px); }

button.btn-cancel {
  background: var(--muted);
  color: #fff;
  padding: 12px 24px;
  border: none;
  border-radius: 8px;
  font-weight: 700;
  cursor: pointer;
  display: none;
}

/* Table Styles */
.table-wrap { overflow-x: auto; margin-top: 32px; border-radius: 8px; border: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; background: #fff; }
th, td { padding: 14px; text-align: left; border-bottom: 1px solid var(--line); font-size: 13.5px; }
th { background: var(--cream-pale); color: var(--maroon-deep); font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: 0.05em; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--paper); }

.btn-del, .btn-edit {
  border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 700; transition: all 0.2s ease;
}
.btn-del { background: #fee2e2; color: var(--danger); }
.btn-edit { background: #fef3c7; color: var(--edit); margin-right: 6px; }
.btn-del:hover { background: var(--danger); color: #fff; }
.btn-edit:hover { background: var(--edit); color: #fff; }

/* Responsive */
@media (max-width: 860px) {
  .sidebar { position: absolute; height: 100%; transform: translateX(-100%); }
  .sidebar.collapsed { transform: translateX(0); width: 260px; }
  .main { padding: 20px 16px; }
  .container { padding: 20px; }
}

    </style>
</head>
<body>

        <!-- Top bar -->
        <div class="topbar">
          <button class="menu-toggle" id="menuToggle" title="Thu gọn / Mở rộng Sidebar">&#9776;</button>
          <div class="mark">CS</div>
          <div class="titles">
            <h1>Hệ thống Quản lý Hỗ trợ</h1>
            <span>Trang tổng quan Customer Success</span>
          </div>
        </div>
      
        <div class="body" id="bodyEl">
          <!-- SIDEBAR -->
          <div class="sidebar" id="sidebarEl">
            <div class="sidebar-menu">
              <a href="/CS/TrangChuCS/trangchu-cs.html" class="menu-item active">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>Trang chủ</span>
              </a>
              <a href="/CS/QuanLyTicketCS/cs-ticket.html" class="menu-item">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                <span>Quản lý Ticket</span>
              </a>
              <a href="/CS/PhieuHoTroCS/phieuhotro-cs.html" class="menu-item">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                <span>Tạo phiếu hỗ trợ</span>
              </a>
              <a href="/CS/Dashboard/cs-dashboard.html" class="menu-item">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"></path><path d="M7 16l4-5 3 3 5-7"></path></svg>
                <span>Báo cáo thống kê</span>
              </a>
              <a href="/FAQs/CS-FAQ.html" class="menu-item">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                <span>FAQs</span>
              </a>
              <a href="/CS/account-CS.html" class="menu-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                <span>Cài đặt hệ thống</span>
              </a>
            </div>
          </div>
      
          <!-- MAIN CONTENT -->
          <div class="main">
            <div class="container">
              <h2 id="formTitle">Quản Lý FAQ - CS Center</h2>
              <form id="csForm">
                <div class="form-group">
                  <label>Danh mục:</label>
                  <select id="category">
                    <option value="Tài khoản & Đăng nhập">Tài khoản & Đăng nhập</option>
                    <option value="Lịch học & Thời gian">Lịch học & Thời gian</option>
                    <option value="Học phí & Thanh toán">Học phí & Thanh toán</option>
                    <option value="Chứng chỉ & Kết quả">Chứng chỉ & Kết quả</option>
                    <option value="Kỹ thuật & Hệ thống">Kỹ thuật & Hệ thống</option>
                  </select>
                </div>
                <div class="form-group">
                  <label>Câu hỏi:</label>
                  <input type="text" id="question" placeholder="Nhập câu hỏi..." required>
                </div>
                <div class="form-group">
                  <label>Câu trả lời:</label>
                  <textarea id="answer" rows="3" placeholder="Nhập câu trả lời..." required></textarea>
                </div>
                <div class="btn-row">
                  <button type="submit" class="btn-add" id="submitBtn">Lưu FAQ</button>
                  <button type="button" class="btn-cancel" id="cancelBtn" onclick="cancelEdit()">Hủy sửa</button>
                </div>
              </form>
      
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>STT</th>
                      <th>Danh mục</th>
                      <th>Câu hỏi</th>
                      <th>Thao tác</th>
                    </tr>
                  </thead>
                  <tbody id="adminTable"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    <script>
        const FAQ_COLLECTION = "faqs";
        let editingId = null;
        async function renderAdminTable() {
            const tbody = document.getElementById("adminTable");
            tbody.innerHTML = `
                <tr>
                    <td colspan="4" style="text-align:center;">
                        Đang tải dữ liệu...
                    </td>
                </tr>
            `;
            try {
                const snapshot = await db
                    .collection(FAQ_COLLECTION)
                    .get();
                tbody.innerHTML = "";
                if (snapshot.empty) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="4" style="text-align:center;">
                                Chưa có FAQ nào.
                            </td>
                        </tr>
                    `;
                    return;
                }
                let index = 1;
                snapshot.forEach(doc => {
                    const item = doc.data();
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>
                            ${index}
                        </td>
                        <td>
                            <b>${escapeHTML(item.category || "")}</b>
                        </td>
                        <td>
                            ${escapeHTML(item.question || "")}
                        </td>
                        <td>
                            <button
                                class="btn-edit"
                                onclick="editFaq('${doc.id}')"
                            >
                                Sửa
                            </button>
                            <button
                                class="btn-del"
                                onclick="deleteFaq('${doc.id}')"
                            >
                                Xóa
                            </button>
                        </td>
                    `;
                    tbody.appendChild(row);
                    index++;
                });
            } catch (error) {
                console.error("Lỗi tải FAQ:", error);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" style="text-align:center;color:red;">
                            Không thể tải FAQ.
                        </td>
                    </tr>
                `;
            }
        }
        document
            .getElementById("csForm")
            .addEventListener("submit", async function (e) {
                e.preventDefault();
                const category =
                    document.getElementById("category").value.trim();
                const question =
                    document.getElementById("question").value.trim();
                const answer =
                    document.getElementById("answer").value.trim();
                if (!question || !answer) {
                    alert("Vui lòng nhập đầy đủ câu hỏi và câu trả lời.");
                    return;
                }
                const faqData = {
                    category: category,
                    question: question,
                    answer: answer,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                };
                try {
                    if (editingId) {
                        await db
                            .collection(FAQ_COLLECTION)
                            .doc(editingId)
                            .update(faqData);
                        alert("Đã cập nhật FAQ thành công!");
                    }
                    else {
                        faqData.createdAt =
                            firebase.firestore.FieldValue.serverTimestamp();
                        await db
                            .collection(FAQ_COLLECTION)
                            .add(faqData);
                        alert("Đã thêm FAQ thành công!");
                    }
                    cancelEdit();
                    renderAdminTable();
                } catch (error) {
                    console.error("Lỗi lưu FAQ:", error);
                    alert(
                        "Có lỗi xảy ra khi lưu FAQ:\n" +
                        error.message
                    );
                }
            });
        async function editFaq(id) {
            try {
                const doc = await db
                    .collection(FAQ_COLLECTION)
                    .doc(id)
                    .get();
                if (!doc.exists) {
                    alert("FAQ không tồn tại.");
                    return;
                }
                const item = doc.data();
                editingId = id;
                document.getElementById("category").value =
                    item.category || "";
                document.getElementById("question").value =
                    item.question || "";
                document.getElementById("answer").value =
                    item.answer || "";
                document.getElementById("formTitle").textContent =
                    "Chỉnh Sửa FAQ";
                document.getElementById("submitBtn").textContent =
                    "Cập Nhật FAQ";
   
                document.getElementById("cancelBtn").style.display =
                    "block";
                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            } catch (error) {
                console.error("Lỗi lấy FAQ:", error);
                alert(
                    "Không thể lấy dữ liệu FAQ:\n" +
                    error.message
                );
            }
        }
        function cancelEdit() {
            editingId = null;
            document.getElementById("category").selectedIndex = 0;
            document.getElementById("question").value = "";
            document.getElementById("answer").value = "";
            document.getElementById("formTitle").textContent =
                "Quản Lý FAQ - CS Center";
            document.getElementById("submitBtn").textContent =
                "Lưu FAQ";
            document.getElementById("cancelBtn").style.display =
                "none";
        }
        async function deleteFaq(id) {
            if (!confirm("Bạn muốn xóa câu hỏi này?")) {
                return;
            }
            try {
                await db
                    .collection(FAQ_COLLECTION)
                    .doc(id)
                    .delete();
                alert("Đã xóa FAQ thành công!");
                if (editingId === id) {
                    cancelEdit();
                }
                renderAdminTable();
            } catch (error) {
                console.error("Lỗi xóa FAQ:", error);
                alert(
                    "Không thể xóa FAQ:\n" +
                    error.message
                );
            }
        }
        function escapeHTML(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }
        renderAdminTable();
    </script>
    <script type="module" src="/CS/navbar.js"></script>
</body>
</html>
