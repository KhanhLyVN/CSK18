<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>CS Center - Quản Lý FAQ</title>
    <link rel="stylesheet" href="/CS/navbar.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script src="/firebase-config.js"></script>
    <style>
        :root {
            --maroon: #5d0703;
            --maroon-deep: #3e0402;
            --maroon-soft: #7a1410;
            --cream: #eedcc8;
            --cream-pale: #fbf4e9;
            --paper: #fffbf5;
            --gold: #b08a4e;
            --ink: #2a1712;
            --ink-soft: #6b5348;
            --line: rgba(93, 7, 3, .15);
            --ok: #4c6b3c;
            --danger: #a23b2e;
            --muted: #8a7a6d;
            --edit: #b08a4e;
            --topbar-height: 58px;
            --sidebar-width: 260px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-width: 0;
            min-height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body {
            color: var(--ink);
            background: var(--cream-pale);
            background-image: radial-gradient(circle at 1px 1px, rgba(93, 7, 3, .04) 1px, transparent 0);
            background-size: 24px 24px;
            font-family: "Inter", sans-serif;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button:focus-visible,
        a:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 2px solid var(--maroon);
            outline-offset: 2px;
        }

        /* =========================================================
   APP VÀ NAVBAR CUSTOMER SUCCESS
   navbar.js sẽ tự chèn topbar/sidebar vào .app
   ========================================================= */

        .app {
            width: 100%;
            min-height: 100vh;
            height: auto !important;
            overflow: visible !important;
        }

        .cs-navbar-topbar {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 12px;
            height: var(--topbar-height);
            padding: 9px 20px;
            color: var(--cream-pale);
            background: var(--maroon);
            border-bottom: 1px solid rgba(0, 0, 0, .15);
        }

        .cs-navbar-toggle {
            width: 34px;
            height: 34px;
            display: inline-grid;
            flex: 0 0 34px;
            place-items: center;
            padding: 0;
            border: 0;
            border-radius: 7px;
            color: inherit;
            background: transparent;
            cursor: pointer;
            font-size: 21px;
            line-height: 1;
        }

        .cs-navbar-toggle:hover {
            background: rgba(255, 255, 255, .12);
        }

        .cs-navbar-brand {
            min-width: 0;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: inherit;
            text-decoration: none;
        }

        .cs-navbar-mark {
            width: 34px;
            height: 34px;
            display: inline-grid;
            flex: 0 0 34px;
            place-items: center;
            border-radius: 7px;
            color: var(--maroon-deep);
            background: var(--cream);
            font: 700 15px/1 "Fraunces", serif;
        }

        .cs-navbar-brand-copy {
            min-width: 0;
            display: grid;
            gap: 2px;
            line-height: 1.2;
        }

        .cs-navbar-brand-copy strong {
            overflow: hidden;
            max-width: min(420px, 65vw);
            color: var(--cream-pale);
            font: 600 17px/1.2 "Fraunces", serif;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .cs-navbar-brand-copy small {
            color: rgba(251, 244, 233, .76);
            font-size: 10px;
            line-height: 1.2;
        }

        .cs-navbar-layout {
            display: block;
            width: 100%;
            min-height: calc(100vh - var(--topbar-height));
            height: auto !important;
            padding-top: var(--topbar-height);
            overflow: visible !important;
        }

        .cs-navbar-sidebar {
            position: fixed;
            top: var(--topbar-height);
            bottom: 0;
            left: 0;
            z-index: 90;
            width: var(--sidebar-width);
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            overflow-y: auto;
            color: var(--ink-soft);
            background: var(--paper);
            border-right: 1px solid var(--line);
            transition: width .22s ease, transform .22s ease;
        }

        .cs-navbar-menu {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 14px 10px;
        }

        .cs-navbar-menu a {
            min-height: 40px;
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 9px 12px;
            border-left: 3px solid transparent;
            border-radius: 8px;
            color: inherit;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
        }

        .cs-navbar-menu a svg {
            width: 17px;
            height: 17px;
            flex: 0 0 17px;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 1.8;
        }

        .cs-navbar-menu a:hover {
            color: var(--maroon);
            background: var(--cream-pale);
        }

        .cs-navbar-menu a.active {
            color: var(--maroon-deep);
            background: var(--cream);
            border-left-color: var(--maroon);
            font-weight: 800;
        }

        .cs-navbar-note {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: auto 14px 16px;
            padding: 10px 11px;
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--ink-soft);
            background: var(--cream-pale);
            font-size: 10px;
            font-weight: 700;
            white-space: nowrap;
        }

        .cs-navbar-note i {
            width: 8px;
            height: 8px;
            flex: 0 0 8px;
            border-radius: 50%;
            background: #9ab77c;
            box-shadow: 0 0 0 3px rgba(154, 183, 124, .18);
        }

        .cs-navbar-layout.is-collapsed .cs-navbar-sidebar {
            width: 70px;
        }

        .cs-navbar-layout.is-collapsed .cs-navbar-menu a {
            justify-content: center;
            padding-inline: 8px;
            font-size: 0;
        }

        .cs-navbar-layout.is-collapsed .cs-navbar-menu a svg {
            margin: 0;
        }

        .cs-navbar-layout.is-collapsed .cs-navbar-note {
            justify-content: center;
            margin-inline: 10px;
            padding-inline: 0;
            font-size: 0;
        }

        .cs-navbar-content {
            display: block;
            width: auto;
            min-width: 0;
            min-height: calc(100vh - var(--topbar-height));
            margin-left: var(--sidebar-width);
            overflow: visible !important;
            transition: margin-left .22s ease;
        }

        .cs-navbar-layout.is-collapsed .cs-navbar-content {
            margin-left: 70px;
        }

        .cs-navbar-overlay {
            position: fixed;
            inset: 0;
            z-index: 80;
            border: 0;
            background: rgba(42, 23, 18, .3);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .cs-navbar-overlay.is-visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* =========================================================
   MAIN VÀ FORM FAQ
   ========================================================= */
        .cs-navbar-content>.main {
            width: 100%;
            min-width: 0;
            min-height: calc(100vh - var(--topbar-height));
            padding: 26px clamp(16px, 3vw, 38px) 42px;
            overflow: visible;
            background-image: radial-gradient(circle at 1px 1px, rgba(93, 7, 3, .03) 1px, transparent 0);
            background-size: 24px 24px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 30px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--paper);
            box-shadow: 0 4px 20px rgba(93, 7, 3, .05);
        }

        h2 {
            margin: 0 0 24px;
            color: var(--maroon-deep);
            font: 600 clamp(24px, 3vw, 30px)/1.15 "Fraunces", serif;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: var(--maroon-deep);
            font-size: 13px;
            font-weight: 700;
        }

        input,
        select,
        textarea {
            width: 100%;
            min-height: 42px;
            padding: 10px 12px;
            border: 1.5px solid var(--line);
            border-radius: 8px;
            outline: none;
            color: var(--ink);
            background: #fff;
            font-size: 13px;
            transition: border-color .2s ease, box-shadow .2s ease;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
            line-height: 1.5;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--maroon);
            box-shadow: 0 0 0 3px rgba(93, 7, 3, .1);
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        button.btn-add,
        button.btn-cancel {
            min-height: 42px;
            padding: 10px 20px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
        }

        button.btn-add {
            flex: 1;
            color: var(--cream-pale);
            background: var(--maroon);
        }

        button.btn-add:hover {
            background: var(--maroon-deep);
        }

        button.btn-cancel {
            display: none;
            color: #fff;
            background: var(--muted);
        }

        /* =========================================================
   BẢNG FAQ
   ========================================================= */
        .table-wrap {
            width: 100%;
            max-width: 100%;
            margin-top: 28px;
            overflow-x: auto;
            border: 1px solid var(--line);
            border-radius: 8px;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            min-width: 620px;
            border-collapse: collapse;
            background: #fff;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid var(--line);
            text-align: left;
            vertical-align: middle;
            font-size: 12px;
        }

        th {
            color: var(--maroon-deep);
            background: var(--cream-pale);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .05em;
            text-transform: uppercase;
        }

        tr:last-child td {
            border-bottom: 0;
        }

        tr:hover td {
            background: var(--paper);
        }

        .btn-del,
        .btn-edit {
            min-height: 30px;
            padding: 6px 10px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
        }

        .btn-edit {
            margin-right: 5px;
            color: var(--edit);
            background: #fef3c7;
        }

        .btn-del {
            color: var(--danger);
            background: #fee2e2;
        }

        .btn-edit:hover {
            color: #fff;
            background: var(--edit);
        }

        .btn-del:hover {
            color: #fff;
            background: var(--danger);
        }

        /* =========================================================
   MOBILE
   ========================================================= */
                /* =========================================================
           MODAL XÁC NHẬN XÓA FAQ
           ========================================================= */
        .confirm-modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: grid;
            place-items: center;
            padding: 20px;
            background: rgba(42, 23, 18, .48);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity .2s ease, visibility .2s ease;
        }

        .confirm-modal.is-open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .confirm-dialog {
            width: min(430px, 100%);
            padding: 26px;
            border: 1px solid rgba(93, 7, 3, .16);
            border-radius: 18px;
            background: var(--paper);
            box-shadow: 0 24px 70px rgba(42, 23, 18, .24);
            transform: translateY(12px) scale(.97);
            transition: transform .2s ease;
        }

        .confirm-modal.is-open .confirm-dialog {
            transform: translateY(0) scale(1);
        }

        .confirm-icon {
            width: 52px;
            height: 52px;
            display: grid;
            place-items: center;
            margin-bottom: 16px;
            border-radius: 50%;
            color: var(--danger);
            background: #fde9e5;
            font-size: 21px;
        }

        .confirm-dialog h3 {
            margin: 0 0 8px;
            color: var(--maroon-deep);
            font: 700 24px/1.15 "Fraunces", serif;
        }

        .confirm-dialog p {
            margin: 0;
            color: var(--ink-soft);
            font-size: 13px;
            line-height: 1.65;
        }

        .confirm-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 24px;
        }

        .confirm-actions button {
            min-height: 40px;
            padding: 9px 16px;
            border: 0;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 800;
        }

        .confirm-cancel {
            color: var(--ink-soft);
            background: #eee8e1;
        }

        .confirm-cancel:hover {
            background: #e2d9d0;
        }

        .confirm-delete {
            color: #fff;
            background: var(--danger);
            box-shadow: 0 6px 15px rgba(162, 59, 46, .2);
        }

        .confirm-delete:hover {
            background: #8d2e25;
        }

        @media (max-width: 860px) {

            :root {
                --topbar-height: 56px;
            }

            html,
            body {
                overflow-x: hidden;
                overflow-y: auto !important;
            }

            .app {
                min-height: 100vh;
                height: auto !important;
                overflow: visible !important;
            }

            .cs-navbar-topbar {
                position: sticky;
                top: 0;
                height: 56px;
                min-height: 56px;
                padding: 8px 14px;
            }

            .cs-navbar-layout {
                min-height: calc(100vh - 56px);
                padding-top: 0;
            }

            .cs-navbar-sidebar {
                position: fixed;
                top: 56px;
                bottom: 0;
                left: 0;
                width: min(280px, 84vw);
                transform: translateX(-105%);
                box-shadow: 12px 0 30px rgba(62, 4, 2, .16);
            }

            .cs-navbar-layout.is-mobile-open .cs-navbar-sidebar {
                transform: translateX(0);
            }

            .cs-navbar-content,
            .cs-navbar-layout.is-collapsed .cs-navbar-content {
                width: 100%;
                min-height: calc(100vh - 56px);
                margin-left: 0 !important;
            }

            .cs-navbar-content>.main {
                min-height: calc(100vh - 56px);
                padding: 14px 10px 28px;
            }

            .container {
                max-width: none;
                margin: 0;
                padding: 20px 16px;
                border-radius: 10px;
            }

            h2 {
                margin-bottom: 18px;
                font-size: clamp(21px, 6vw, 26px);
            }

            .form-group {
                margin-bottom: 15px;
            }

            label {
                margin-bottom: 6px;
                font-size: 12px;
            }

            input,
            select,
            textarea {
                min-height: 42px;
                padding: 10px 11px;
                font-size: 13px;
            }

            .btn-row {
                flex-direction: column;
                gap: 8px;
            }

            button.btn-add,
            button.btn-cancel {
                width: 100%;
                min-height: 42px;
            }

            .table-wrap {
                margin-top: 22px;
            }

            table {
                min-width: 620px;
            }

            th,
            td {
                padding: 10px 9px;
                font-size: 11px;
            }

            th {
                font-size: 9px;
            }

            .btn-del,
            .btn-edit {
                min-height: 32px;
                padding: 6px 8px;
                font-size: 10px;
            }
        }

        @media (max-width: 560px) {
            :root {
                --topbar-height: 54px;
            }

            .cs-navbar-topbar {
                height: 54px;
                min-height: 54px;
                padding-inline: 12px;
            }

            .cs-navbar-sidebar {
                top: 54px;
            }

            .cs-navbar-brand-copy strong {
                max-width: 64vw;
                font-size: 14px;
            }

            .cs-navbar-brand-copy small {
                display: none;
            }

            .cs-navbar-content>.main {
                min-height: calc(100vh - 54px);
                padding: 10px 7px 22px;
            }

            .container {
                padding: 16px 12px 20px;
                border-radius: 8px;
            }

            h2 {
                font-size: 21px;
            }

            .table-wrap {
                margin-right: -2px;
                margin-left: -2px;
            }
        }

        @media (max-width: 360px) {
            .container {
                padding-inline: 10px;
            }

            h2 {
                font-size: 19px;
            }

            input,
            select,
            textarea {
                font-size: 12px;
            }
        }
    </style>
</head>

        <!-- MAIN CONTENT -->
        <div class="main">
            <div class="container">
                <h2 id="formTitle">Quản Lý FAQ - CS Center</h2>
                <form id="csForm">
                    <div class="form-group">
                        <label>Danh mục:</label>
                        <select id="category">
                            <option value="Tài khoản & Đăng nhập">Tài khoản & Đăng nhập</option>
                            <option value="Lịch học & Thời gian">Lịch học & Thời gian</option>
                            <option value="Học phí & Thanh toán">Học phí & Thanh toán</option>
                            <option value="Chứng chỉ & Kết quả">Chứng chỉ & Kết quả</option>
                            <option value="Kỹ thuật & Hệ thống">Kỹ thuật & Hệ thống</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Câu hỏi:</label>
                        <input type="text" id="question" placeholder="Nhập câu hỏi..." required>
                    </div>
                    <div class="form-group">
                        <label>Câu trả lời:</label>
                        <textarea id="answer" rows="3" placeholder="Nhập câu trả lời..." required></textarea>
                    </div>
                    <div class="btn-row">
                        <button type="submit" class="btn-add" id="submitBtn">Lưu FAQ</button>
                        <button type="button" class="btn-cancel" id="cancelBtn" onclick="cancelEdit()">Hủy sửa</button>
                    </div>
                </form>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>STT</th>
                                <th>Danh mục</th>
                                <th>Câu hỏi</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="adminTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
        </div>
    </div>

    <!-- Hộp thoại xác nhận tùy biến, thay cho confirm() mặc định của trình duyệt -->
    <div class="confirm-modal" id="deleteConfirmModal" aria-hidden="true">
        <div class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="deleteConfirmTitle">
            <div class="confirm-icon"><i class="fa-solid fa-trash-can"></i></div>
            <h3 id="deleteConfirmTitle">Xóa câu hỏi này?</h3>
            <p>FAQ sẽ bị xóa khỏi hệ thống và không thể khôi phục. Bạn có chắc chắn muốn tiếp tục không?</p>
            <div class="confirm-actions">
                <button class="confirm-cancel" id="cancelDeleteBtn" type="button">Hủy bỏ</button>
                <button class="confirm-delete" id="confirmDeleteBtn" type="button"><i class="fa-solid fa-trash-can"></i> Xóa FAQ</button>
            </div>
        </div>
    </div>

    <script>

        const FAQ_COLLECTION = "faqs";
        let editingId = null;
        async function renderAdminTable() {
            const tbody = document.getElementById("adminTable");
            tbody.innerHTML = `
                <tr>
                    <td colspan="4" style="text-align:center;">
                        Đang tải dữ liệu...
                    </td>
                </tr>
            `;
            try {
                const snapshot = await db
                    .collection(FAQ_COLLECTION)
                    .get();
                tbody.innerHTML = "";
                if (snapshot.empty) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="4" style="text-align:center;">
                                Chưa có FAQ nào.
                            </td>
                        </tr>
                    `;
                    return;
                }
                let index = 1;
                snapshot.forEach(doc => {
                    const item = doc.data();
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>
                            ${index}
                        </td>
                        <td>
                            <b>${escapeHTML(item.category || "")}</b>
                        </td>
                        <td>
                            ${escapeHTML(item.question || "")}
                        </td>
                        <td>
                            <button
                                class="btn-edit"
                                onclick="editFaq('${doc.id}')"
                            >
                                Sửa
                            </button>
                            <button
                                class="btn-del"
                                onclick="deleteFaq('${doc.id}')"
                            >
                                Xóa
                            </button>
                        </td>
                    `;
                    tbody.appendChild(row);
                    index++;
                });
            } catch (error) {
                console.error("Lỗi tải FAQ:", error);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" style="text-align:center;color:red;">
                            Không thể tải FAQ.
                        </td>
                    </tr>
                `;
            }
        }
        document
            .getElementById("csForm")
            .addEventListener("submit", async function (e) {
                e.preventDefault();
                const category =
                    document.getElementById("category").value.trim();
                const question =
                    document.getElementById("question").value.trim();
                const answer =
                    document.getElementById("answer").value.trim();
                if (!question || !answer) {
                    alert("Vui lòng nhập đầy đủ câu hỏi và câu trả lời.");
                    return;
                }
                const faqData = {
                    category: category,
                    question: question,
                    answer: answer,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                };
                try {
                    if (editingId) {
                        await db
                            .collection(FAQ_COLLECTION)
                            .doc(editingId)
                            .update(faqData);
                        alert("Đã cập nhật FAQ thành công!");
                    }
                    else {
                        faqData.createdAt =
                            firebase.firestore.FieldValue.serverTimestamp();
                        await db
                            .collection(FAQ_COLLECTION)
                            .add(faqData);
                        alert("Đã thêm FAQ thành công!");
                    }
                    cancelEdit();
                    renderAdminTable();
                } catch (error) {
                    console.error("Lỗi lưu FAQ:", error);
                    alert(
                        "Có lỗi xảy ra khi lưu FAQ:\n" +
                        error.message
                    );
                }
            });
        async function editFaq(id) {
            try {
                const doc = await db
                    .collection(FAQ_COLLECTION)
                    .doc(id)
                    .get();
                if (!doc.exists) {
                    alert("FAQ không tồn tại.");
                    return;
                }
                const item = doc.data();
                editingId = id;
                document.getElementById("category").value =
                    item.category || "";
                document.getElementById("question").value =
                    item.question || "";
                document.getElementById("answer").value =
                    item.answer || "";
                document.getElementById("formTitle").textContent =
                    "Chỉnh Sửa FAQ";
                document.getElementById("submitBtn").textContent =
                    "Cập Nhật FAQ";

                document.getElementById("cancelBtn").style.display =
                    "block";
                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            } catch (error) {
                console.error("Lỗi lấy FAQ:", error);
                alert(
                    "Không thể lấy dữ liệu FAQ:\n" +
                    error.message
                );
            }
        }
        function cancelEdit() {
            editingId = null;
            document.getElementById("category").selectedIndex = 0;
            document.getElementById("question").value = "";
            document.getElementById("answer").value = "";
            document.getElementById("formTitle").textContent =
                "Quản Lý FAQ - CS Center";
            document.getElementById("submitBtn").textContent =
                "Lưu FAQ";
            document.getElementById("cancelBtn").style.display =
                "none";
        }
                function showDeleteConfirm() {
            const modal = document.getElementById("deleteConfirmModal");
            const cancelButton = document.getElementById("cancelDeleteBtn");
            const confirmButton = document.getElementById("confirmDeleteBtn");

            return new Promise(resolve => {
                const close = result => {
                    modal.classList.remove("is-open");
                    modal.setAttribute("aria-hidden", "true");
                    document.removeEventListener("keydown", handleKeydown);
                    resolve(result);
                };

                const handleKeydown = event => {
                    if (event.key === "Escape") close(false);
                };

                modal.classList.add("is-open");
                modal.setAttribute("aria-hidden", "false");
                document.addEventListener("keydown", handleKeydown);

                cancelButton.onclick = () => close(false);
                confirmButton.onclick = () => close(true);
                modal.onclick = event => {
                    if (event.target === modal) close(false);
                };

                requestAnimationFrame(() => cancelButton.focus());
            });
        }

        async function deleteFaq(id) {
            const shouldDelete = await showDeleteConfirm();
            if (!shouldDelete) return;

            try {
                await db
                    .collection(FAQ_COLLECTION)
                    .doc(id)
                    .delete();
                alert("Đã xóa FAQ thành công!");
                if (editingId === id) {
                    cancelEdit();
                }
                renderAdminTable();
            } catch (error) {
                console.error("Lỗi xóa FAQ:", error);
                alert(
                    "Không thể xóa FAQ:\n" +
                    error.message
                );
            }
        }

        function escapeHTML(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }
        renderAdminTable();
    </script>
    <script src="/CS/navbar.js"></script>
</body>

</html>
