<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Center</title>
    <link rel="stylesheet" href="/CS/login/login.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script src="/firebase-config.js" defer></script>
    <script src="/CS/login/login.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0"
        rel="stylesheet">
</head>
<body>
<div class="container" id="container">
    <div class="left-panel">
        <div class="form-wrapper">
            <form class="login-form active-form" id="loginForm">
                <h1>Welcome Back</h1>
                <p>
                    Đăng nhập để tiếp tục sử dụng hệ thống
                    Hỗ trợ & Phản hồi người dùng.
                </p>
                <div class="input-box">
                    <span class="material-symbols-outlined">mail</span>
                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        autocomplete="username"
                        placeholder="Email"
                        required>
                </div>
                <div class="input-box password-box">
                    <span class="material-symbols-outlined">lock</span>
                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        autocomplete="current-password"
                        placeholder="Mật khẩu"
                        required>

                    <span class="toggle-password">
                        <span class="material-symbols-outlined">visibility</span>
                    </span>
                </div>
                <div class="option">
                    <label>
                        <input type="checkbox">
                        Ghi nhớ đăng nhập
                    </label>
                    <a href="quenmatkhau.html" id="forgotPassword">
                        Quên mật khẩu?
                    </a>
                </div>
                <button
                    type="submit"
                    class="btn">
                    Đăng nhập
                </button>
                <div class="line">
                    <span>Hoặc</span>
                </div>
                <button
                    type="button"
                    class="google-btn"
                    id="googleLogin">

                    <svg class="google-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true">
                        <path fill="#4285F4"
                            d="M21.35 12.23c0-.79-.07-1.55-.2-2.28H12v4.32h5.23a4.47 4.47 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.92-4.18 2.92-7.43z"/>
                        <path fill="#34A853"
                            d="M12 21.75c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.93-3.31.93-2.54 0-4.69-1.72-5.46-4.03H3.29v2.53A9.75 9.75 0 0 0 12 21.75z"/>
                        <path fill="#FBBC05"
                            d="M6.54 13.84a5.86 5.86 0 0 1 0-3.68V7.63H3.29a9.75 9.75 0 0 0 0 8.74l3.25-2.53z"/>
                        <path fill="#EA4335"
                            d="M12 6.13c1.43 0 2.72.49 3.73 1.46l2.8-2.8C16.84 3.18 14.63 2.25 12 2.25a9.75 9.75 0 0 0-8.71 5.38l3.25 2.53C7.31 7.85 9.46 6.13 12 6.13z"/>
                    </svg>

                    <span>Đăng nhập bằng Google</span>
                </button>
            </form>
        </div>
    </div>
    <div class="right-panel">
        <div class="overlay">
            <h1>
                Welcome to Support Center
            </h1>
            <p>
                Chúng tôi luôn sẵn sàng tiếp nhận,
                hỗ trợ và phản hồi mọi yêu cầu của bạn.
            </p>
            <img
                src="download.png"
                alt="illustration">
        </div>
    </div>
</div>
</body>
</html>
