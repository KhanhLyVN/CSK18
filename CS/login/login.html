<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Center</title>
    <link rel="stylesheet" href="/CS/login/login.css">
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-storage-compat.js"></script>
    <script src="/firebase-config.js" defer></script>
    <script src="/CS/login/login.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        <!-- <link rel="stylesheet" href="/HỌC VIÊN/Trang chủ/homepage.html"> -->
</head>
<body>
<div class="container" id="container">
    <div class="left-panel">
        <div class="form-wrapper">
            <form class="login-form active-form" id="loginForm">
                <h1>Welcome Back</h1>
                <p>
                    Đăng nhập để tiếp tục sử dụng hệ thống
                    Hỗ trợ & Phản hồi người dùng.
                </p>
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Email"
                        required>
                </div>
                <div class="input-box password-box">
                    <i class="fa-solid fa-lock"></i>
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Mật khẩu"
                        required>
                    <span class="toggle-password">
                        <i class="fa-solid fa-eye"></i>
                    </span>
                </div>
                <div class="option">
                    <label>
                        <input type="checkbox">
                        Ghi nhớ đăng nhập
                    </label>
                    <a href="quenmatkhau.html" id="forgotPassword">
                        Quên mật khẩu?
                    </a>
                </div>
                <button
                    type="submit"
                    class="btn">
                    Đăng nhập
                </button>
                <div class="line">
                    <span>Hoặc</span>
                </div>
                <button
                    type="button"
                    class="google-btn"
                    id="googleLogin">
                    <i class="fa-brands fa-google"></i>
                    Đăng nhập bằng Google
                </button>
            </form>
        </div>
    </div>
    <div class="right-panel">
        <div class="overlay">
            <h1>
                Welcome to Support Center
            </h1>
            <p>
                Chúng tôi luôn sẵn sàng tiếp nhận,
                hỗ trợ và phản hồi mọi yêu cầu của bạn.
            </p>
            <img
                src="download.png"
                alt="illustration">
        </div>
    </div>
</div>
</body>
</html>
